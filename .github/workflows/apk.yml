name: Construir APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar os ficheiros do repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar a app (pasta www)
        run: |
          mkdir www
          cp index.html styles.css app.js sw.js manifest.json icon-192.png icon-512.png www/

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Criar o projeto Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ao.saldar.life",
            "appName": "Saldar Life",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Pôr o ícone da app
        run: |
          RES=android/app/src/main/res
          if command -v magick >/dev/null 2>&1; then
            IM=magick
          elif command -v convert >/dev/null 2>&1; then
            IM=convert
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IM=convert
          fi
          rm -rf $RES/mipmap-anydpi-v26
          for par in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${par%%:*}
            s=${par##*:}
            $IM icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Permitir partilhar ficheiros (pasta de cache)
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <cache-path name="cache" path="." />
            <files-path name="files" path="." />
            <external-path name="external" path="." />
          </paths>
          EOF

      - name: Tela cheia e ponte para partilhar ficheiros
        run: |
          cat > android/app/src/main/java/ao/saldar/life/MainActivity.java <<'EOF'
          package ao.saldar.life;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import androidx.core.content.FileProvider;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends BridgeActivity {

            // A app chama window.SaldarNativo.partilhar(...) para guardar/enviar um ficheiro
            public class PonteSaldar {
              @JavascriptInterface
              public String partilhar(String nome, String texto, String titulo, String mime) {
                try {
                  String limpo = nome.replaceAll("[^A-Za-z0-9._-]", "_");
                  File pasta = new File(getCacheDir(), "partilha");
                  if (!pasta.exists()) {
                    pasta.mkdirs();
                  }
                  File ficheiro = new File(pasta, limpo);
                  FileOutputStream saida = new FileOutputStream(ficheiro);
                  saida.write(texto.getBytes("UTF-8"));
                  saida.close();

                  final Uri uri = FileProvider.getUriForFile(
                    MainActivity.this, getPackageName() + ".fileprovider", ficheiro);
                  final String tipo = mime;
                  final String tit = titulo;

                  runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType(tipo);
                      i.putExtra(Intent.EXTRA_STREAM, uri);
                      i.putExtra(Intent.EXTRA_SUBJECT, tit);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(i, tit));
                    }
                  });
                  return "ok";
                } catch (Exception e) {
                  return "erro: " + e.getMessage();
                }
              }
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(new PonteSaldar(), "SaldarNativo");
              if (Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode =
                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              esconderBarras();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                esconderBarras();
              }
            }

            private void esconderBarras() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c =
                WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          EOF

      - name: Construir o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Saldar-Life.apk

      - name: Publicar o APK para descarregar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" Saldar-Life.apk \
            --title "Saldar Life APK ${{ github.run_number }}" \
            --notes "APK do Saldar Life. Descarrega o ficheiro Saldar-Life.apk e instala no telemóvel."

      - name: Guardar também como ficheiro da execução
        uses: actions/upload-artifact@v4
        with:
          name: saldar-life-apk
          path: Saldar-Life.apk
