name: Construir APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar os ficheiros do repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar a app (pasta www)
        run: |
          mkdir www
          cp index.html styles.css app.js sw.js manifest.json icon-192.png icon-512.png www/

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Criar o projeto Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ao.saldar.life",
            "appName": "Saldar Life",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Pôr o ícone da app
        run: |
          RES=android/app/src/main/res
          if command -v magick >/dev/null 2>&1; then
            IM=magick
          elif command -v convert >/dev/null 2>&1; then
            IM=convert
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IM=convert
          fi
          rm -rf $RES/mipmap-anydpi-v26
          for par in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${par%%:*}
            s=${par##*:}
            $IM icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Construir o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Saldar-Life.apk

      - name: Publicar o APK para descarregar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" Saldar-Life.apk \
            --title "Saldar Life APK ${{ github.run_number }}" \
            --notes "APK do Saldar Life. Descarrega o ficheiro Saldar-Life.apk e instala no telemóvel."

      - name: Guardar também como ficheiro da execução
        uses: actions/upload-artifact@v4
        with:
          name: saldar-life-apk
          path: Saldar-Life.apk
